name: CI

on:
  push:
    branches: [main]
    paths:
      - "testdata-generator-api/**"
      - "testdata-generator-core/**"
      - "pom.xml"
      - "docker-compose.yml"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "testdata-generator-api/**"
      - "testdata-generator-core/**"
      - "pom.xml"
      - "docker-compose.yml"
      - "docs/**"
      - ".github/workflows/ci.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests
        run: mvn -B test -pl testdata-generator-api -am

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Flyway integration (PostgreSQL + MySQL via Testcontainers)
        run: mvn -B test -pl testdata-generator-api -am -Pintegration
