name: Deploy to Google Cloud

on:
  push:
    branches: [main]
    paths:
      - "testdata-generator-api/**"
      - "testdata-generator-core/**"
      - "pom.xml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docs/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPO || 'observability' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      TESTDATA_SAAS_CORS_ORIGINS: ${{ vars.TESTDATA_SAAS_CORS_ORIGINS }}
      TESTDATA_SAAS_ADMIN_EMAIL: ${{ secrets.TESTDATA_SAAS_ADMIN_EMAIL }}
      TESTDATA_SAAS_ADMIN_PASSWORD: ${{ secrets.TESTDATA_SAAS_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Image prefix
        id: prefix
        run: echo "value=${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push testdata-studio
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/testdata-studio:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/testdata-studio:latest
          cache-from: type=gha,scope=testdata-studio
          cache-to: type=gha,mode=max,scope=testdata-studio

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${SPRING_DATASOURCE_URL}" ]; then
            echo "::error::SPRING_DATASOURCE_URL is empty. Add the JDBC URL as a repository secret."
            missing=1
          fi
          if [ -z "${SPRING_DATASOURCE_USERNAME}" ]; then
            echo "::error::SPRING_DATASOURCE_USERNAME is empty. Add it as a repository secret."
            missing=1
          fi
          if [ -z "${SPRING_DATASOURCE_PASSWORD}" ]; then
            echo "::error::SPRING_DATASOURCE_PASSWORD is empty. Add it as a repository secret."
            missing=1
          fi
          if [ -z "${TESTDATA_SAAS_ADMIN_EMAIL}" ]; then
            echo "::error::TESTDATA_SAAS_ADMIN_EMAIL is empty. Add it under Settings → Secrets and variables → Actions → Repository secrets (not Variables)."
            missing=1
          fi
          if [ -z "${TESTDATA_SAAS_ADMIN_PASSWORD}" ]; then
            echo "::error::TESTDATA_SAAS_ADMIN_PASSWORD is empty. Add it as a repository secret."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Cloud Run env file
        run: |
          {
            echo "SERVER_PORT=8080"
            echo "SPRING_PROFILES_ACTIVE=cloud"
            echo "TESTDATA_EDITION=saas"
            echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}"
            echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}"
            echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}"
            echo "TESTDATA_SAAS_ADMIN_EMAIL=${TESTDATA_SAAS_ADMIN_EMAIL}"
            echo "TESTDATA_SAAS_ADMIN_PASSWORD=${TESTDATA_SAAS_ADMIN_PASSWORD}"
            if [ -n "${TESTDATA_SAAS_CORS_ORIGINS}" ]; then
              echo "TESTDATA_SAAS_CORS_ORIGINS=${TESTDATA_SAAS_CORS_ORIGINS}"
            fi
          } > "${GITHUB_WORKSPACE}/cloudrun.env"

      - name: Deploy testdata-studio to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        id: studio
        with:
          service: testdata-studio
          image: ${{ steps.prefix.outputs.value }}/testdata-studio:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --port=8080 --allow-unauthenticated --cpu=1 --memory=1Gi --min-instances=0 --max-instances=1
          env_vars_file: cloudrun.env

      - name: Service URL
        run: echo "Studio API ${{ steps.studio.outputs.url }}"
