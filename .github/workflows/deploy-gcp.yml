name: Deploy to Google Cloud

on:
  push:
    branches: [main]
    paths:
      - "testdata-generator-api/**"
      - "testdata-generator-core/**"
      - "pom.xml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docs/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPO || 'observability' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      TESTDATA_SAAS_CORS_ORIGINS: ${{ vars.TESTDATA_SAAS_CORS_ORIGINS }}
      TESTDATA_SAAS_ADMIN_EMAIL: ${{ secrets.TESTDATA_SAAS_ADMIN_EMAIL }}
      TESTDATA_SAAS_ADMIN_PASSWORD: ${{ secrets.TESTDATA_SAAS_ADMIN_PASSWORD }}
      TESTDATA_REDIS_CACHE_ENABLED: ${{ vars.TESTDATA_REDIS_CACHE_ENABLED }}
      TESTDATA_REDIS_HOST: ${{ secrets.TESTDATA_REDIS_HOST }}
      TESTDATA_REDIS_PORT: ${{ vars.TESTDATA_REDIS_PORT }}
      TESTDATA_REDIS_PASSWORD: ${{ secrets.TESTDATA_REDIS_PASSWORD }}
      TESTDATA_REDIS_SSL: ${{ vars.TESTDATA_REDIS_SSL }}
      TESTDATA_REDIS_DISABLE_PEER_VERIFICATION: ${{ vars.TESTDATA_REDIS_DISABLE_PEER_VERIFICATION }}
      TESTDATA_REDIS_CACHE_TTL_SECONDS: ${{ vars.TESTDATA_REDIS_CACHE_TTL_SECONDS }}
      STUDIO_API_URL: ${{ vars.STUDIO_API_URL }}
      STUDIO_UI_URL: ${{ vars.STUDIO_UI_URL }}
      TESTDATA_AUTH_OIDC_ENABLED: ${{ vars.TESTDATA_AUTH_OIDC_ENABLED }}
      TESTDATA_AUTH_OIDC_ISSUER: ${{ vars.TESTDATA_AUTH_OIDC_ISSUER }}
      TESTDATA_AUTH_OIDC_CLIENT_ID: ${{ secrets.TESTDATA_AUTH_OIDC_CLIENT_ID }}
      TESTDATA_AUTH_OIDC_CLIENT_SECRET: ${{ secrets.TESTDATA_AUTH_OIDC_CLIENT_SECRET }}
      TESTDATA_AUTH_OIDC_REDIRECT_URI: ${{ vars.TESTDATA_AUTH_OIDC_REDIRECT_URI }}
      TESTDATA_AUTH_OIDC_UI_BASE: ${{ vars.TESTDATA_AUTH_OIDC_UI_BASE }}
      TESTDATA_AUTH_OIDC_ALLOW_REGISTRATION: ${{ vars.TESTDATA_AUTH_OIDC_ALLOW_REGISTRATION }}
      TESTDATA_AUTH_GITHUB_ENABLED: ${{ vars.TESTDATA_AUTH_GITHUB_ENABLED }}
      TESTDATA_AUTH_GITHUB_CLIENT_ID: ${{ secrets.TESTDATA_AUTH_GITHUB_CLIENT_ID }}
      TESTDATA_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.TESTDATA_AUTH_GITHUB_CLIENT_SECRET }}
      TESTDATA_AUTH_GITHUB_REDIRECT_URI: ${{ vars.TESTDATA_AUTH_GITHUB_REDIRECT_URI }}
      TESTDATA_AUTH_GITHUB_UI_BASE: ${{ vars.TESTDATA_AUTH_GITHUB_UI_BASE }}
      TESTDATA_AUTH_GITHUB_ALLOW_REGISTRATION: ${{ vars.TESTDATA_AUTH_GITHUB_ALLOW_REGISTRATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Image prefix
        id: prefix
        run: echo "value=${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push testdata-studio
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/testdata-studio:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/testdata-studio:latest
          cache-from: type=gha,scope=testdata-studio
          cache-to: type=gha,mode=max,scope=testdata-studio

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${SPRING_DATASOURCE_URL}" ]; then
            echo "::error::SPRING_DATASOURCE_URL is empty. Add the JDBC URL as a repository secret."
            missing=1
          fi
          if [ -z "${SPRING_DATASOURCE_USERNAME}" ]; then
            echo "::error::SPRING_DATASOURCE_USERNAME is empty. Add it as a repository secret."
            missing=1
          fi
          if [ -z "${SPRING_DATASOURCE_PASSWORD}" ]; then
            echo "::error::SPRING_DATASOURCE_PASSWORD is empty. Add it as a repository secret."
            missing=1
          fi
          if [ -z "${TESTDATA_SAAS_ADMIN_EMAIL}" ]; then
            echo "::error::TESTDATA_SAAS_ADMIN_EMAIL is empty. Add it under Settings → Secrets and variables → Actions → Repository secrets (not Variables)."
            missing=1
          fi
          if [ -z "${TESTDATA_SAAS_ADMIN_PASSWORD}" ]; then
            echo "::error::TESTDATA_SAAS_ADMIN_PASSWORD is empty. Add it as a repository secret."
            missing=1
          fi
          if [ "${TESTDATA_AUTH_OIDC_ENABLED}" = "true" ]; then
            if [ -z "${TESTDATA_AUTH_OIDC_CLIENT_ID}" ] || [ -z "${TESTDATA_AUTH_OIDC_CLIENT_SECRET}" ]; then
              echo "::error::TESTDATA_AUTH_OIDC_ENABLED=true requires secrets TESTDATA_AUTH_OIDC_CLIENT_ID and TESTDATA_AUTH_OIDC_CLIENT_SECRET."
              missing=1
            fi
            redirect="${TESTDATA_AUTH_OIDC_REDIRECT_URI}"
            if [ -z "$redirect" ] && [ -n "${STUDIO_API_URL}" ]; then
              redirect="${STUDIO_API_URL%/}"
            fi
            ui_base="${TESTDATA_AUTH_OIDC_UI_BASE}"
            if [ -z "$ui_base" ] && [ -n "${STUDIO_UI_URL}" ]; then
              ui_base="${STUDIO_UI_URL%/}"
            fi
            if [ -z "$redirect" ] || [ -z "$ui_base" ]; then
              echo "::error::OIDC needs TESTDATA_AUTH_OIDC_REDIRECT_URI and TESTDATA_AUTH_OIDC_UI_BASE, or STUDIO_API_URL + STUDIO_UI_URL repository variables."
              missing=1
            fi
          fi
          if [ "${TESTDATA_AUTH_GITHUB_ENABLED}" = "true" ]; then
            if [ -z "${TESTDATA_AUTH_GITHUB_CLIENT_ID}" ] || [ -z "${TESTDATA_AUTH_GITHUB_CLIENT_SECRET}" ]; then
              echo "::error::TESTDATA_AUTH_GITHUB_ENABLED=true requires secrets TESTDATA_AUTH_GITHUB_CLIENT_ID and TESTDATA_AUTH_GITHUB_CLIENT_SECRET."
              missing=1
            fi
            if [ -z "${TESTDATA_AUTH_GITHUB_REDIRECT_URI}" ]; then
              echo "::error::TESTDATA_AUTH_GITHUB_ENABLED=true requires repository variable TESTDATA_AUTH_GITHUB_REDIRECT_URI (full callback URL)."
              missing=1
            fi
            ui_base="${TESTDATA_AUTH_GITHUB_UI_BASE}"
            if [ -z "$ui_base" ] && [ -n "${STUDIO_UI_URL}" ]; then
              ui_base="${STUDIO_UI_URL%/}"
            fi
            if [ -z "$ui_base" ]; then
              echo "::error::GitHub sign-in needs TESTDATA_AUTH_GITHUB_UI_BASE or STUDIO_UI_URL repository variable."
              missing=1
            fi
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Cloud Run env file
        run: |
          {
            echo "SERVER_PORT=8080"
            echo "SPRING_PROFILES_ACTIVE=cloud"
            echo "TESTDATA_EDITION=saas"
            echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}"
            echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}"
            echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}"
            echo "TESTDATA_SAAS_ADMIN_EMAIL=${TESTDATA_SAAS_ADMIN_EMAIL}"
            echo "TESTDATA_SAAS_ADMIN_PASSWORD=${TESTDATA_SAAS_ADMIN_PASSWORD}"
            if [ -n "${TESTDATA_SAAS_CORS_ORIGINS}" ]; then
              echo "TESTDATA_SAAS_CORS_ORIGINS=${TESTDATA_SAAS_CORS_ORIGINS}"
            fi
            if [ -n "${TESTDATA_REDIS_CACHE_ENABLED}" ]; then
              echo "TESTDATA_REDIS_CACHE_ENABLED=${TESTDATA_REDIS_CACHE_ENABLED}"
            fi
            if [ -n "${TESTDATA_REDIS_HOST}" ]; then
              echo "TESTDATA_REDIS_HOST=${TESTDATA_REDIS_HOST}"
            fi
            if [ -n "${TESTDATA_REDIS_PORT}" ]; then
              echo "TESTDATA_REDIS_PORT=${TESTDATA_REDIS_PORT}"
            fi
            if [ -n "${TESTDATA_REDIS_PASSWORD}" ]; then
              echo "TESTDATA_REDIS_PASSWORD=${TESTDATA_REDIS_PASSWORD}"
            fi
            if [ -n "${TESTDATA_REDIS_SSL}" ]; then
              echo "TESTDATA_REDIS_SSL=${TESTDATA_REDIS_SSL}"
            fi
            if [ -n "${TESTDATA_REDIS_DISABLE_PEER_VERIFICATION}" ]; then
              echo "TESTDATA_REDIS_DISABLE_PEER_VERIFICATION=${TESTDATA_REDIS_DISABLE_PEER_VERIFICATION}"
            fi
            if [ -n "${TESTDATA_REDIS_CACHE_TTL_SECONDS}" ]; then
              echo "TESTDATA_REDIS_CACHE_TTL_SECONDS=${TESTDATA_REDIS_CACHE_TTL_SECONDS}"
            fi
            if [ "${TESTDATA_AUTH_OIDC_ENABLED}" = "true" ]; then
              echo "TESTDATA_AUTH_OIDC_ENABLED=true"
              if [ -n "${TESTDATA_AUTH_OIDC_ISSUER}" ]; then
                echo "TESTDATA_AUTH_OIDC_ISSUER=${TESTDATA_AUTH_OIDC_ISSUER}"
              fi
              echo "TESTDATA_AUTH_OIDC_CLIENT_ID=${TESTDATA_AUTH_OIDC_CLIENT_ID}"
              echo "TESTDATA_AUTH_OIDC_CLIENT_SECRET=${TESTDATA_AUTH_OIDC_CLIENT_SECRET}"
              redirect="${TESTDATA_AUTH_OIDC_REDIRECT_URI}"
              if [ -z "$redirect" ] && [ -n "${STUDIO_API_URL}" ]; then
                redirect="${STUDIO_API_URL%/}"
              fi
              echo "TESTDATA_AUTH_OIDC_REDIRECT_URI=${redirect}"
              ui_base="${TESTDATA_AUTH_OIDC_UI_BASE}"
              if [ -z "$ui_base" ] && [ -n "${STUDIO_UI_URL}" ]; then
                ui_base="${STUDIO_UI_URL%/}"
              fi
              echo "TESTDATA_AUTH_OIDC_UI_BASE=${ui_base}"
              if [ -n "${TESTDATA_AUTH_OIDC_ALLOW_REGISTRATION}" ]; then
                echo "TESTDATA_AUTH_OIDC_ALLOW_REGISTRATION=${TESTDATA_AUTH_OIDC_ALLOW_REGISTRATION}"
              fi
            elif [ -n "${TESTDATA_AUTH_OIDC_ENABLED}" ]; then
              echo "TESTDATA_AUTH_OIDC_ENABLED=${TESTDATA_AUTH_OIDC_ENABLED}"
            fi
            if [ "${TESTDATA_AUTH_GITHUB_ENABLED}" = "true" ]; then
              echo "TESTDATA_AUTH_GITHUB_ENABLED=true"
              echo "TESTDATA_AUTH_GITHUB_CLIENT_ID=${TESTDATA_AUTH_GITHUB_CLIENT_ID}"
              echo "TESTDATA_AUTH_GITHUB_CLIENT_SECRET=${TESTDATA_AUTH_GITHUB_CLIENT_SECRET}"
              echo "TESTDATA_AUTH_GITHUB_REDIRECT_URI=${TESTDATA_AUTH_GITHUB_REDIRECT_URI}"
              ui_base="${TESTDATA_AUTH_GITHUB_UI_BASE}"
              if [ -z "$ui_base" ] && [ -n "${STUDIO_UI_URL}" ]; then
                ui_base="${STUDIO_UI_URL%/}"
              fi
              echo "TESTDATA_AUTH_GITHUB_UI_BASE=${ui_base}"
              if [ -n "${TESTDATA_AUTH_GITHUB_ALLOW_REGISTRATION}" ]; then
                echo "TESTDATA_AUTH_GITHUB_ALLOW_REGISTRATION=${TESTDATA_AUTH_GITHUB_ALLOW_REGISTRATION}"
              fi
            elif [ -n "${TESTDATA_AUTH_GITHUB_ENABLED}" ]; then
              echo "TESTDATA_AUTH_GITHUB_ENABLED=${TESTDATA_AUTH_GITHUB_ENABLED}"
            fi
          } > "${GITHUB_WORKSPACE}/cloudrun.env"

      - name: Deploy testdata-studio to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        id: studio
        with:
          service: testdata-studio
          image: ${{ steps.prefix.outputs.value }}/testdata-studio:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --port=8080 --allow-unauthenticated --cpu=1 --memory=1Gi --min-instances=0 --max-instances=1
          env_vars_file: cloudrun.env

      - name: Service URL
        run: echo "Studio API ${{ steps.studio.outputs.url }}"
