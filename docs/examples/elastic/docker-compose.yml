# Local Elastic stack for Studio API logs: Elasticsearch + Kibana + Filebeat.
# For local development only: security is off and every port is bound to 127.0.0.1, so there are no credentials.
#
# 1. Run the API with an ECS JSON log file (console stays readable), from the repo root:
#      $env:TESTDATA_LOG_FILE = "$PWD\logs\testdata-studio.json"
#      mvn -pl testdata-generator-api -am spring-boot:run
# 2. docker compose -f docs/examples/elastic/docker-compose.yml up -d
# 3. Kibana: http://localhost:5601 → Discover, data view "filebeat-*". See docs/LOGGING.md.
name: testdata-studio-elastic

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.18.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.18.0}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.18.0}
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # The folder holding the API's TESTDATA_LOG_FILE (default: <repo>/logs).
      - ${STUDIO_LOG_DIR:-../../logs}:/var/log/testdata-studio:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
  filebeat-data:
