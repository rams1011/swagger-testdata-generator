# Shared settings for docker, datacenter, and cloud (activated via spring.profiles.group).
spring:
  config:
    activate:
      on-profile: hosted
  flyway:
    enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
  h2:
    console:
      enabled: false
