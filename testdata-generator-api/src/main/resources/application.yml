server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

spring:
  application:
    name: testdata-studio
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    # Set TESTDATA_DATASOURCE_* in the environment. No production secrets in this file.
    url: ${TESTDATA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdata_studio?sslmode=require}
    username: ${TESTDATA_DATASOURCE_USERNAME:postgres}
    password: ${TESTDATA_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ssl: true
        sslmode: require
  h2:
    console:
      enabled: false
      path: /h2-console

testdata:
  # Hosting mode — set only this:
  #   local      desktop, no login
  #   datacenter login + admin, no plan (default when blank)
  #   saas       login + plan
  edition: ${TESTDATA_EDITION:local}
  storage:
    # excel | h2 | database
    type: ${TESTDATA_STORAGE_TYPE:h2}
  excel:
    file: ./studio-output/studio-testdata.xlsx
  h2:
    file: ${TESTDATA_H2_FILE:./studio-output/testdata}
    username: sa
    password: ""
    console: ${TESTDATA_H2_CONSOLE:true}
    in-memory: false
  default-output-dir: ./studio-output
  default-excel-file-name: TestData.xlsx
  run-history:
    # Oldest batches are deleted after each write. 0 disables pruning.
    max-per-spec: 100
  saas:
    # Operator/session settings — not the hosting mode. Use testdata.edition for that.
    session-days: 14
    cors-origins: ${TESTDATA_SAAS_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    # Set both in the environment (Cloud Run / local .env). Empty means no bootstrap admin.
    admin-email: ${TESTDATA_SAAS_ADMIN_EMAIL:}
    admin-password: ${TESTDATA_SAAS_ADMIN_PASSWORD:}
    org-name: ${TESTDATA_SAAS_ORG_NAME:Studio}
    workspace-name: ${TESTDATA_SAAS_WORKSPACE_NAME:Default}

logging:
  level:
    com.tx.api.test.generator.studio: INFO
    com.tx.api.test.generator.studio.logging.MethodLoggingAspect: WARN
