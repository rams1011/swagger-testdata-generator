server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

spring:
  application:
    name: testdata-studio
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: update
      schema-locations: classpath:ddl/schema.sql
  datasource:
    # Used when testdata.storage.type is database (PostgreSQL). Overridden automatically for h2.
    url: jdbc:postgresql://34.170.44.243:5432/testdata_studio?sslmode=require
    username: postgres
    password: ")4eKf:74\\7CCcptU"
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ssl: true
        sslmode: require
  h2:
    console:
      enabled: false
      path: /h2-console

testdata:
  storage:
    # excel | h2 | database
    type: ${TESTDATA_STORAGE_TYPE:database}
  excel:
    file: ./studio-output/studio-testdata.xlsx
  h2:
    file: ${TESTDATA_H2_FILE:./studio-output/testdata}
    username: sa
    password: ""
    console: true
    in-memory: false
  default-output-dir: ./studio-output
  default-excel-file-name: TestData.xlsx
  run-history:
    # Oldest batches are deleted after each write. 0 disables pruning.
    max-per-spec: 100
  saas:
    # false: single local workspace, no login (desktop Studio).
    # true: hosted multi-tenant product — register/login and isolate specs by workspace.
    enabled: false
    session-days: 14
    cors-origins: ${TESTDATA_SAAS_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.run.app,https://*.*.run.app}
    # Platform operator who enables customer workspaces. Change these in production.
    admin-email: saas.admin@local.test
    admin-password: saas-admin-1

logging:
  level:
    com.tx.api.test.generator.studio: INFO
    com.tx.api.test.generator.studio.logging.MethodLoggingAspect: WARN
