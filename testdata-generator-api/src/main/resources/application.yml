server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

management:
  # Separate from the API so Prometheus scrapes are not gated by workspace auth.
  # Keep this port off the public network.
  server:
    port: ${MANAGEMENT_PORT:8084}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Off unless a collector is configured. Boot 4 enables this exporter by default.
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
  otlp:
    metrics:
      export:
        # The OpenTelemetry starter otherwise pushes metrics to localhost:4318.
        enabled: ${OTEL_EXPORTER_OTLP_METRICS_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

spring:
  data:
    redis:
      repositories:
        enabled: false
  application:
    name: testdata-studio
  profiles:
    # Exactly one hosting profile must be active: local | docker | datacenter | cloud.
    # Use default (not active) so SPRING_PROFILES_ACTIVE / --spring.profiles.active replaces local.
    default: local
    group:
      docker: hosted
      datacenter: hosted
      cloud: hosted
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: false
      path: /h2-console

testdata:
  cache:
    redis:
      # Optional read-through cache (TESTDATA_REDIS_* / deploy-gcp cloudrun.env). Off unless enabled=true.
      # Cached: specs, plans, envs, cases, run history, audit lists, request-file metadata — not auth, runs, file bytes.
      enabled: ${TESTDATA_REDIS_CACHE_ENABLED:false}
      host: ${TESTDATA_REDIS_HOST:localhost}
      port: ${TESTDATA_REDIS_PORT:6379}
      password: ${TESTDATA_REDIS_PASSWORD:}
      ssl: ${TESTDATA_REDIS_SSL:false}
      # When ssl=true, disables TLS certificate verification (managed Redis with internal CAs).
      disable-peer-verification: ${TESTDATA_REDIS_DISABLE_PEER_VERIFICATION:true}
      ttl-seconds: ${TESTDATA_REDIS_CACHE_TTL_SECONDS:300}
  # Hosting mode — set only this:
  #   local      desktop, no login
  #   datacenter login + admin, no plan (default when blank)
  #   saas       login + plan
  edition: ${TESTDATA_EDITION:datacenter}
  default-output-dir: ./studio-output
  default-excel-file-name: TestData.xlsx
  run-history:
    # Oldest batches are deleted after each write. 0 disables pruning.
    max-per-spec: 100
  run:
    # Try and Run plan. Hosted editions cannot call loopback, private, link-local, or cloud metadata.
    # The local profile allows private networks so a desktop app can call localhost.
    allow-private-networks: ${TESTDATA_RUN_ALLOW_PRIVATE_NETWORKS:false}
    # Optional tighter list. Example: api.example.com,*.partner.test
    allow-hosts: ${TESTDATA_RUN_ALLOW_HOSTS:}
  # Studio user sign-in (not run-auth on Try/Run). Ignored when testdata.edition=local.
  auth:
    # local = PBKDF2 passwords in td_account. ldap = directory bind at POST /api/auth/login only.
    provider: ${TESTDATA_AUTH_PROVIDER:local}
    # When provider=ldap, bootstrap admin (testdata.saas.admin-*) may still sign in locally if LDAP is down.
    local-admin-fallback: ${TESTDATA_AUTH_LOCAL_ADMIN_FALLBACK:true}
    # Local accounts only. Directory passwords are not stored or aged here.
    password-max-age-days: ${TESTDATA_PASSWORD_MAX_AGE_DAYS:90}
    password-history: ${TESTDATA_PASSWORD_HISTORY:5}
    # Shared by local and directory sign-in. 0 turns that control off.
    login-max-failures: ${TESTDATA_LOGIN_MAX_FAILURES:5}
    login-lockout-minutes: ${TESTDATA_LOGIN_LOCKOUT_MINUTES:15}
    login-ip-max-attempts: ${TESTDATA_LOGIN_IP_MAX_ATTEMPTS:20}
    login-ip-window-seconds: ${TESTDATA_LOGIN_IP_WINDOW_SECONDS:60}
    session-idle-minutes: ${TESTDATA_SESSION_IDLE_MINUTES:30}
    ldap:
      # Required when provider=ldap. Prefer ldaps://. No sample host — startup fails if this is empty.
      url: ${TESTDATA_LDAP_URL:}
      # Required when provider=ldap. Users sign in as user@domain (jsmith → jsmith@domain).
      domain: ${TESTDATA_LDAP_DOMAIN:}
      # Reject ldap:// unless true (labs only). Production should use ldaps://.
      allow-insecure: ${TESTDATA_LDAP_ALLOW_INSECURE:false}
      connect-timeout-ms: ${TESTDATA_LDAP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${TESTDATA_LDAP_READ_TIMEOUT_MS:5000}
      # Optional. When empty, direct bind as user@domain (typical AD). When set, search-then-bind as manager first.
      manager-dn: ${TESTDATA_LDAP_MANAGER_DN:}
      manager-password: ${TESTDATA_LDAP_MANAGER_PASSWORD:}
      # Optional. Defaults to DC=… from domain when search is used.
      base-dn: ${TESTDATA_LDAP_BASE_DN:}
      user-search-base: ${TESTDATA_LDAP_USER_SEARCH_BASE:}
      # Optional. Default filter matches userPrincipalName or mail; {0} = normalized login.
      user-search-filter: ${TESTDATA_LDAP_USER_SEARCH_FILTER:}
      # Optional. User must be in this group DN or login fails (generic error).
      allowed-group: ${TESTDATA_LDAP_ALLOWED_GROUP:}
      email-attribute: ${TESTDATA_LDAP_EMAIL_ATTRIBUTE:mail}
      display-name-attribute: ${TESTDATA_LDAP_DISPLAY_NAME_ATTRIBUTE:displayName}
      # Optional. If any DN is set, LDAP overwrites workspace role on each login from memberOf.
      group-role:
        owner: ${TESTDATA_LDAP_GROUP_ROLE_OWNER:}
        admin: ${TESTDATA_LDAP_GROUP_ROLE_ADMIN:}
        member: ${TESTDATA_LDAP_GROUP_ROLE_MEMBER:}
      # GET /api/testdata/config exposes authProvider=ldap and loginHint=you@<domain> (no secrets).
  saas:
    # Operator/session settings — not the hosting mode. Use testdata.edition for that.
    session-days: 14
    cors-origins: ${TESTDATA_SAAS_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    # Datacenter with provider=local requires both. Empty fails startup. Do not commit a password here.
    admin-email: ${TESTDATA_SAAS_ADMIN_EMAIL:}
    admin-password: ${TESTDATA_SAAS_ADMIN_PASSWORD:}
    org-name: ${TESTDATA_SAAS_ORG_NAME:Studio}
    workspace-name: ${TESTDATA_SAAS_WORKSPACE_NAME:Default}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] [%X{traceId:-}/%X{spanId:-}] %logger{40} - %msg%n"
  level:
    com.tx.api.test.generator.studio: INFO
    # Per-method traces. Leave at WARN. Set this logger to DEBUG only when tracing a single call.
    com.tx.api.test.generator.studio.logging.MethodLoggingAspect: WARN
